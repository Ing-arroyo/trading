[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ancla"
version = "0.1.0"
description = "Buscador de entradas de scalping basado en el libro de órdenes y en Bitcoin."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic>=2.9",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
ancla = "ancla.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["ancla*"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
